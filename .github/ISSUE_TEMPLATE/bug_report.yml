name: Bug report
description: A tool gives a wrong result, an error, or does not load.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please do not attach personal files.** If a file triggers the bug, try a harmless one that does the same, or describe it below.
        Security problems go to the [Security tab](https://github.com/candygoogy/eolietech/security), not here.
  - type: input
    id: url
    attributes:
      label: Tool page
      description: The address of the page, e.g. https://eolietech.com/compress-pdf/
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: e.g. Safari 18 on iPhone 15, Firefox 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Copy any error message shown on the page.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The file (description only)
      description: Format, size, pixel or page count, and where it came from (an iPhone, a scanner, an e-invoicing portal). No personal files, please.
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Optional. Errors from the browser's developer console, if you can open it.
      render: text
